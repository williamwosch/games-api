spring:
  application:
    name: games

  datasource:
    url: jdbc:h2:file:./data/gamesdb
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:troque-esta-chave-por-uma-bem-grande-com-pelo-menos-32-caracteres}
  expiration-minutes: 60

logging:
  level:
    br.pucpr.games: DEBUG

admin:
  email: ${ADMIN_EMAIL:admin@games.com}
  password: ${ADMIN_PASSWORD:}